[project]
name = "systmonline-fhir-importer"
version = "0.5.0"
description = "Preserve SystmOnline and Patients Know Best records as reviewable FHIR evidence."
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
systmonline-fhir = "systmonline_fhir.cli:main"
systmonline-fhir-export = "systmonline_fhir.export:main"
systmonline-fhir-terminology-audit = "systmonline_fhir.terminology_audit:main"
systmonline-fhir-verify = "systmonline_fhir.verify:main"
pkb-fhir-import = "systmonline_fhir.pkb:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/systmonline_fhir"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
