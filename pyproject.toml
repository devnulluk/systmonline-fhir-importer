[project]
name = "systmonline-fhir-importer"
version = "0.2.0"
description = "Preserve SystmOnline patient-record exports and convert them to reviewable FHIR R4 bundles."
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
systmonline-fhir = "systmonline_fhir.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/systmonline_fhir"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
